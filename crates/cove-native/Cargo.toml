[package]
name = "cove-native"
version.workspace = true
edition.workspace = true
license.workspace = true

# The code generator is an optional feature, and it is off by default.
#
# ADR 0055's adoption gate asks that "a build without the native feature has
# no executable-memory dependency". That is a fact about the *dependency
# graph*, not about which functions are compiled, so it has to be bought with
# `optional = true` on the dependency itself — a `cfg(feature = ...)` inside a
# `.rs` file would still have built `libc` and still have linked the `mmap`
# and `mprotect` that map an executable page.
#
# Default off, so the ordinary `cargo t` and the ordinary `cargo build` of
# this workspace compile none of it. What that costs is that this crate's own
# tests are behind the feature too, and the price is paid deliberately: the
# ADR's requirement is about the *default* build, and a feature that is on by
# default is not one anybody would remember to turn off. `.github/workflows/
# ci.yml` runs the suite again with it, which is where the tests below are
# executed.
#
# There is one arm. [ADR 0066] retires the Cranelift arm ADR 0055 named and
# ADR 0056 kept for the comparison: the comparison has been made, it is
# recorded in ADR 0056, and what remained was a second lowering per new IR
# instruction that no distributed build contains. `template` is the
# hand-written x86-64 arm, and its only dependency is `libc` — `mmap` and
# `mprotect`, which is the whole of what it needs to honour W^X.
#
# [ADR 0066]: ../../docs/adr/0066-a-comparison-ends-when-its-question-is-answered.md
[features]
default = []
template = ["dep:libc"]

[dependencies]
cove-ir = { workspace = true }

# `Method::Set`'s `Some`/`None` case names come from here rather than being
# written out again: `cove-schema`'s own note on `SOME_CASE`/`NONE_CASE` is
# that the four case names are what issue #53 was about, named in one place
# so `cove-sema` and `cove-runtime` cannot drift on them — and a third
# spelling in this crate would be the same drift once more. `cove-schema` has
# no dependencies of its own, so this costs the "no executable-memory
# dependency" gate nothing.
cove-schema = { workspace = true }

libc = { version = "0.2", optional = true }

[dev-dependencies]
# `cove_ir::Function` carries a `Span` per instruction, so a hand-built
# function needs one. Only the tests build functions by hand.
cove-diag = { workspace = true }

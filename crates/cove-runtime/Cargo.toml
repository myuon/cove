[package]
name = "cove-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

# The native tier's code generator, off by default.
#
# One feature per `cove-native` arm, forwarded rather than re-decided, because
# ADR 0055's adoption gate — "a build without the native feature has no
# executable-memory dependency" — is a fact about the whole graph and not about
# one crate in it. Default off, so the ordinary `cargo t` and `cargo build` of
# this workspace map no executable page.
#
# `template` is the arm ADR 0056 adopted and the one `native::compile` uses.
# `cranelift` is kept because ADR 0056 keeps the comparison, and it forwards the
# feature without making a second tier owner: a run selects the tier ADR 0056
# decided, not one of two.
[features]
default = []
cranelift = ["cove-native/cranelift"]
template = ["cove-native/template"]

[dependencies]
cove-diag.workspace = true
cove-ir.workspace = true
# The native tier's ABI declarations, and nothing else.
#
# `cove-native`'s code generators are optional features of *that* crate and both
# are off by default, so this edge pulls in `abi.rs` and no executable-memory
# dependency: ADR 0055's "a build without the native feature has no
# executable-memory dependency" is a fact about `cargo tree`, and this does not
# change it. What it buys is that `vm::native` — the runtime's half of the
# boundary — can be written against the declarations rather than against a copy
# of them, which is the whole reason `abi` is compiled whether a code generator
# is or not.
#
# The edge runs this way and only this way. `cove-native` must not depend on
# `cove-runtime`, which is why the helpers are function pointers; see that
# crate's documentation.
cove-native.workspace = true
cove-schema.workspace = true
cove-syntax.workspace = true
cove-sema.workspace = true

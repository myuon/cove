[package]
name = "cove-bench"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cove-bench"
path = "src/main.rs"

# The native-tier comparison, which is a bin of its own rather than a
# subcommand of the one above: it is an experiment with its own features, its
# own output and no baseline, and `cove-bench`'s gate has neither.
#
# It lives in this crate because the comparison needs all three arms in one
# process — the VM arm needs `cove-runtime`, which `cove-native` must not
# depend on, and this crate already depends on both.
[[bin]]
name = "cove-native-compare"
path = "src/bin/native_compare.rs"

# The Rust formatter's phase table, for issue #369's three-arm comparison. Also
# a bin rather than a flag on `cove fmt`: it is a measurement with no baseline
# and no gate, and it needs `cove-syntax`'s three phases apart, which
# `cove_syntax::parse_file` composes into one call.
[[bin]]
name = "cove-fmt-phases"
path = "src/bin/fmt_phases.rs"

# One feature per arm, mirroring `cove-native`'s own, and both off by default
# so that the ordinary `cargo build` of this workspace has no
# executable-memory dependency.
[features]
default = []
cranelift = ["dep:cove-native", "cove-native/cranelift"]
template = ["dep:cove-native", "cove-native/template"]

[dependencies]
cove-diag.workspace = true
cove-sema.workspace = true
cove-syntax.workspace = true
cove-ir.workspace = true
cove-runtime.workspace = true
cove-native = { workspace = true, optional = true }

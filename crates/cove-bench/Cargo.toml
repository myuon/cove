[package]
name = "cove-bench"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cove-bench"
path = "src/main.rs"

# (`cove-native-compare` was here: the bin that raced the two native code
# generators on identical IR, whose numbers are ADR 0056's. ADR 0066 retired it
# with the arm it was built to race — a comparison ends when its question is
# answered, and the VM-oracle discipline it ran on one extracted loop is what
# `cove-runtime`'s `native_tier.rs` and CI's `covefmtBench` step do on whole
# programs.)

# The Rust formatter's phase table, for issue #369's three-arm comparison. Also
# a bin rather than a flag on `cove fmt`: it is a measurement with no baseline
# and no gate, and it needs `cove-syntax`'s three phases apart, which
# `cove_syntax::parse_file` composes into one call.
[[bin]]
name = "cove-fmt-phases"
path = "src/bin/fmt_phases.rs"

# What starting a program costs, phase by phase, for issue #556. A bin for
# `cove-fmt-phases`'s reason: a measurement with no baseline and no gate.
[[bin]]
name = "cove-compile-phases"
path = "src/bin/compile_phases.rs"

# On by default, as it is on `cove-cli` (ADR 0076), so that the native column
# of `cove-compile-phases` is the tier `cove run --backend native` builds. A
# host the code generator refuses reports no native column.
[features]
default = ["template"]
template = ["cove-runtime/template"]

[dependencies]
cove-diag.workspace = true
cove-sema.workspace = true
cove-syntax.workspace = true
cove-ir.workspace = true
cove-runtime.workspace = true

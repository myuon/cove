name: Fuzz

# Issue 681's priority 1, ADR 0112. docs/FUZZING.md is the manual.
#
# Two lengths of the same job: a one-minute smoke on every pull request that
# touches Rust, which is there to catch a harness that no longer builds or an
# input that crashes at once, and a long run on a schedule, which is where
# findings come from. CI's main job is already the expensive one; this
# workflow is kept out of it so a pull request's ordinary gate is not slowed
# by it, and the smoke is nine short parallel jobs rather than one long one.

on:
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "fuzz/**"
      - "scripts/fuzz*.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/fuzz.yml"
  schedule:
    # 18:00 UTC, 03:00 in Tokyo: once a day, when nobody is waiting on a runner.
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds to fuzz each target"
        required: false
        default: "1500"

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing here writes to the repository, and no secret is read: a fuzz run
# needs neither, and an input that crashes the runtime should not run next to
# a token that could do anything with the crash.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    # The long run is 25 minutes of fuzzing; the rest is the ASan build
    # (about four minutes cold) and the corpus.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 25 || 50 }}
    strategy:
      fail-fast: false
      matrix:
        target: [parse, compile, run, structured, image, differential, differential_source, ir, ir_mutate]
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          if ! command -v cargo-fuzz > /dev/null; then
            cargo install cargo-fuzz --locked --version 0.11.2
          fi
          cargo +nightly --version
          cargo fuzz --version

      # One cache per target, because each job links only its own binary and
      # the nine would otherwise race to save the same key. The key ends in
      # the run id for ci.yml's reason: a key that always misses always saves,
      # and `restore-keys` takes the newest.
      - name: Cache cargo and the fuzz build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-fuzz
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            fuzz/target
            target
          key: ${{ runner.os }}-fuzz-${{ matrix.target }}-${{ hashFiles('**/*.rs', 'crates/*/std/**', '**/Cargo.toml', 'Cargo.lock', 'fuzz/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-fuzz-${{ matrix.target }}-

      # The scheduled run keeps the corpus it grew, so each night starts
      # where the last one stopped. It is a cache and not an artifact: it is
      # readable by this repository's workflows only. The pull-request smoke
      # restores it too, when one exists, and never saves.
      - name: Restore the corpus
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      # The nightly corpus only grows (nothing minimises it yet, issue 709),
      # and libFuzzer runs every input of it before the session's own clock
      # starts: a 2,790-input `differential_source` corpus took 1,102 s of a
      # 60 s smoke and ran the job past its 25 minutes. The smoke never saves,
      # so it keeps an evenly spaced sample of at most 300 inputs, chosen by
      # name and therefore the same on every run of one restored corpus.
      - name: Sample the corpus for the smoke
        if: github.event_name == 'pull_request'
        run: |
          dir="fuzz/corpus/${{ matrix.target }}"
          [ -d "$dir" ] || exit 0
          total=$(find "$dir" -type f | wc -l)
          keep=300
          if [ "$total" -gt "$keep" ]; then
            find "$dir" -type f | LC_ALL=C sort \
              | awk -v n="$total" -v k="$keep" '(NR - 1) % int((n + k - 1) / k) != 0' \
              | xargs rm -f
          fi
          echo "corpus: kept $(find "$dir" -type f | wc -l) of $total inputs"

      - name: Seed the corpus
        run: scripts/fuzz-seed-corpus.sh ${{ matrix.target }}

      # The differential and IR targets count what each input compared (issues
      # 704 and 705, docs/FUZZING.md "What a session compared"): every process
      # libFuzzer starts writes its counts to this directory as it goes. Empty
      # for the other targets, which is the same as unset.
      - name: Fuzz
        env:
          COVE_FUZZ_STATS_DIR: ${{ contains(fromJSON('["differential","differential_source","ir","ir_mutate","image"]'), matrix.target) && format('{0}/fuzz/stats/session', github.workspace) || '' }}
        run: |
          case "${{ github.event_name }}" in
            pull_request) seconds=60; extra=() ;;
            workflow_dispatch) seconds="${{ github.event.inputs.seconds }}"; extra=(-fork="$(nproc)") ;;
            *) seconds=1500; extra=(-fork="$(nproc)") ;;
          esac
          echo "fuzzing ${{ matrix.target }} for ${seconds}s ${extra[*]}"
          scripts/fuzz.sh "${{ matrix.target }}" "$seconds" -- "${extra[@]}"

      # What the session compared, and what its corpus compares: the session's
      # files merged, and the corpus replayed once each by `cove-fuzz stats`,
      # which counts a finding rather than stopping at it. Built on stable
      # without ASan — a count is not a memory-safety question — into the
      # cached `target/`. Whatever the fuzz step did, so a failing run still
      # says what it had compared; and never failing the job itself, which is
      # the fuzz step's to fail.
      - name: Count what was compared
        if: always() && contains(fromJSON('["differential","differential_source","ir","ir_mutate","image"]'), matrix.target)
        continue-on-error: true
        timeout-minutes: 20
        run: |
          cargo build --profile checked -p cove-fuzz --features template
          mkdir -p fuzz/stats/session
          {
            echo "## fuzz ${{ matrix.target }}: what was compared"
            echo
            echo "### This session (every execution, each \`-fork\` child counted)"
            echo
            echo '```'
            ./target/checked/cove-fuzz stats merge fuzz/stats/session \
              2>&1 > fuzz/stats/session.json || true
            echo '```'
            echo
            echo "### The corpus, replayed once each"
            echo
            echo '```'
            ./target/checked/cove-fuzz stats "${{ matrix.target }}" "fuzz/corpus/${{ matrix.target }}" \
              2>&1 > fuzz/stats/corpus.json || true
            echo '```'
            # Which instructions the corpus executed, and not only held
            # (issue 705): a replay that watches every instruction, so the
            # nightly run only.
            if [ "${{ github.event_name }}" != pull_request ]; then
              echo
              echo "### Instructions the corpus held and executed"
              echo
              echo '```'
              ./target/checked/cove-fuzz coverage "${{ matrix.target }}" "fuzz/corpus/${{ matrix.target }}" \
                2>&1 > fuzz/stats/coverage.json || true
              echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The counts are uploaded on every run, pass or fail, so a run that
      # found nothing still says what it compared. Counts only: no input.
      - name: Upload the counts
        if: always() && contains(fromJSON('["differential","differential_source","ir","ir_mutate","image"]'), matrix.target)
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-stats-${{ matrix.target }}-${{ github.run_id }}
          path: fuzz/stats
          retention-days: 30
          if-no-files-found: warn

      - name: Save the corpus
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      # What a crash leaves: the input libFuzzer wrote, and the log with the
      # panic message, the sanitizer report and the seed. An input here may
      # be the shape of a vulnerability, and this repository is public, so the
      # retention is short and docs/FUZZING.md says to triage one before
      # discussing it in the open. No secret is in either file: the job reads
      # none.
      - name: Upload the crash
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}-${{ github.run_id }}
          path: |
            fuzz/artifacts/${{ matrix.target }}
            fuzz/logs
            fuzz/fuzz-*.log
          retention-days: 7
          if-no-files-found: warn

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A failed build should say what failed, not where in the compiler it failed.
  RUST_BACKTRACE: 1
  # Nothing here builds twice in the same job, so incremental compilation
  # buys no rebuild and costs the cache the artifacts it writes to make one
  # possible. Those are most of what a `target` directory weighs, and the
  # cache below is now written on every run.
  CARGO_INCREMENTAL: 0

# Every cargo invocation in the job below runs under `checked`, and that is
# the point rather than a detail. `[profile.checked]` inherits `release` and
# turns `debug-assertions` and `overflow-checks` back on, so it is an
# optimised build with every check the unoptimised one has — and this suite
# *runs Cove programs* rather than merely compiling a harness, so optimisation
# is most of what it costs. One profile also means one dependency graph is
# built instead of two: the job used to compile the workspace unoptimised for
# the tests and again optimised for the benchmark harness.

jobs:
  build:
    name: test, lint, and dogfood
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The runner image ships a current stable toolchain; asking for the two
      # components is a no-op when they are already there and a clear failure
      # when they are not.
      - name: Show the toolchain
        run: |
          rustup component add clippy rustfmt
          rustc --version
          cargo --version
          cargo clippy --version
          cargo fmt --version

      # The two package target directories are cached alongside the
      # workspace's own: `cove build`'s end-to-end test compiles a generated
      # crate under each package it builds from, in a target directory of its
      # own, and without the cache that is a cold release build of the runtime
      # on every run.
      #
      # The key ends in the run id, which is never the same twice, because
      # `actions/cache` writes nothing when the key it was given hits
      # exactly. Keyed on the lockfile alone it therefore saved once — on
      # whichever run first built with that `Cargo.lock` — and every run
      # after it restored that same frozen directory and threw its own work
      # away. A key that always misses always saves, and `restore-keys`
      # takes the most recent one that matches the prefix, which is what
      # the lockfile-keyed entry was meant to be doing all along.
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            examples/target
            tests/e2e/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      # The cache carries the registry and the artifacts of everything the
      # workspace depends on, and nothing more is asked of it.
      #
      # It used to be asked for more. `actions/checkout` writes every source
      # with a fresh timestamp and `actions/cache` extracts artifacts carrying
      # an earlier run's, so cargo's freshness check — "is any source newer
      # than what was built from it" — said yes to every crate and the
      # pipeline recompiled the workspace on every run
      # ([issue #257](https://github.com/myuon/cove/issues/257)). A step here
      # answered that by *dating the sources back*: it kept a manifest of what
      # the cache had been built from and touched every unchanged source to
      # the year 2000, so cargo skipped it.
      #
      # That was unsound, and it took three pull requests to see how
      # ([issue #306](https://github.com/myuon/cove/issues/306)). The manifest
      # was written from the **checkout** rather than from the build, and
      # before the build rather than after it — so a job that restored older
      # artifacts, rebuilt nothing, and saved the result left a cache claiming
      # that this commit's sources had produced somebody else's artifacts. The
      # claim then propagated: every later job trusted it and rebuilt nothing
      # either.
      #
      # What it looked like from outside was a `copies.rs` that measured the
      # lowering as it stood before #302 while comparing it against #303's
      # ratchet — a combination no single commit can produce — on every pull
      # request that did not itself change `cove-ir`. The failure was
      # deterministic, survived re-runs, and went away when the branch was
      # rebased onto a `main` whose own run had rebuilt the crate.
      #
      # A green run that is not about this commit is worse than a slow one, so
      # the step is gone. Cargo rebuilds the workspace's own crates every run
      # and the cache still serves the registry and the dependency artifacts,
      # which is most of a cold build and cannot go stale: a dependency's
      # fingerprint is its version and its features, not a timestamp.

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --profile checked -- -D warnings

      # The `Pages` workflow publishes these docs with warnings denied, so a
      # broken intra-doc link (or any other doc build failure) is a build
      # failure there whether or not it is caught here first. Running the
      # same check on the PR means it is the PR's author who sees it, not a
      # permanently red `main` that hides the next, genuinely new regression.
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --profile checked

      # Split from the doc examples below so that the log says which of the
      # two cost what. They are different things that `cargo test --workspace`
      # runs together: this is the suite, and it is the half that *runs Cove
      # programs* and so is the half optimisation is for.
      - name: cargo test
        run: cargo test --workspace --lib --bins --tests --profile checked

      # The doc examples. Each fenced example compiles as a crate of its own,
      # so this half is compilation rather than execution and behaves the
      # opposite way under a profile — which is exactly why it is a step of
      # its own rather than a number folded into the one above.
      - name: cargo test (the doc examples)
        run: cargo test --workspace --doc --profile checked

      # The `#[ignore]`d cases, which live in `crates/cove-cli/tests/` —
      # `vm_coverage.rs`, `bytecode_corpus.rs` and `build.rs`. The first is
      # the roadmap: it runs every program in the repository on the
      # linear-memory backend and sorts the answers into agrees, disagrees,
      # and does not lower. It is ignored because it *runs* what it lowers,
      # and the benchmark rows are two million turns each, so it is a price
      # worth paying once here rather than on every local `cargo test`.
      #
      # (This comment used to name `crates/cove-runtime/src/frame/tests.rs`
      # and `crates/cove-cli/tests/admits_coverage.rs`. Neither file has
      # existed since ADR 0034 replaced the execution backend.)
      #
      # `--lib --tests` and not `--workspace` alone, because `--ignored`
      # would otherwise reach the doc examples fenced ```ignore, which are
      # marked that way precisely because they do not compile on their own.
      # A target under `tests/` is not part of `--lib`, so `--lib` by itself
      # would build these and never execute them.
      #
      # This is `cargo ratchet` — the same command, character for character,
      # that `.cargo/config.toml` aliases for running it by hand. It was the
      # single most expensive step in the pipeline while it ran unoptimised,
      # which is what the profile is doing here.
      - name: cargo test (the ignored rows)
        run: cargo test --workspace --lib --tests --profile checked -- --ignored

      # Dogfooding. These are the project's own claims about its own sources:
      # the repository is formatted, the representative programs check, and
      # their tests pass. They are checked with the binary this commit builds.
      #
      # `cove-bench` is built here beside the CLI rather than in a step of its
      # own further down, because in one profile they are one build. It also
      # has to be the same profile as the CLI whichever one is chosen: the
      # `startup` benchmark measures a real process, so it spawns the `cove`
      # binary beside itself rather than calling into the runtime in-process.
      - name: Build the cove CLI and the benchmark harness
        run: cargo build --profile checked -p cove-cli -p cove-bench

      - name: cove fmt --check (repository root)
        run: ./target/checked/cove fmt --check

      # `docs/BUILTINS.md` and `docs/builtins.json` are the contents of
      # `crates/cove-schema`, written out. This is what stops them becoming a
      # second table that says something else.
      - name: cove reference --check (repository root)
        run: ./target/checked/cove reference --check

      - name: cove check (examples)
        working-directory: examples
        run: ../target/checked/cove check

      # `httpstatus/status_code.cove` is checked in, generated by
      # `codegen.statusCodes`; this is what catches it going stale.
      - name: cove generate --check (examples)
        working-directory: examples
        run: ../target/checked/cove generate --check

      - name: cove test (examples)
        working-directory: examples
        run: ../target/checked/cove test

      # The two steps above run on the linear-memory backend, because ADR
      # 0034 makes that what a command that runs a program runs it on. The
      # interpreter is still the oracle, and these are the project's own
      # sources — the first real programs to feel a divergence — so they are
      # run on it too. Both together cost under a second.
      - name: cove generate --check and cove test on the interpreter (examples)
        working-directory: examples
        run: |
          ../target/checked/cove generate --check --backend ast
          ../target/checked/cove test --backend ast

      # ADR 0012's performance-gate harness. Wall-clock numbers are too
      # noisy on a shared runner for a threshold to mean anything, so this
      # runs the harness for correctness only: every benchmark executes,
      # every metric it names comes back well-formed, and the process exits
      # 0. Reading the numbers for a real measurement is a local exercise,
      # documented in ADR 0012.
      #
      # Optimized, and once, because none of that needs a slow run to
      # establish. The benchmarks are sized to be measurable in an
      # optimized build — `benches/arith` turns a loop two million times —
      # and this step ran them unoptimized, three times each, with the
      # traced and untraced runs `trace_overhead` needs on top: nine
      # executions of every benchmark, each written to take a while. It
      # cost 422 seconds of a 514-second run, which is 82% of a pipeline
      # spent on the one step that asserts nothing. An optimized build runs
      # `arith` 7.6x faster and one iteration is three times fewer, and
      # neither changes any of the three things above.
      #
      # `checked` rather than `release`, which is the whole of what this step
      # gave up to make the job one profile. It is not free and it is close
      # to it: measured locally, `cove-bench --iterations 1` is 37.6s under
      # `checked` against 36.0s under `release`, which is the overflow checks
      # costing 4%. What it buys is the 30s build of a second copy of the
      # workspace, which no longer happens — the binaries this step wants
      # were built by the dogfooding step above.
      #
      # Neither is the workspace's `bench-stable` profile. That exists only
      # to hold a recorded negative result (issue #179: one codegen unit per
      # crate did not reduce layout sensitivity and cost 44% to 96% more
      # build time), and selecting it here would spend that build time on a
      # step that asserts no number. Nothing in this job builds `release` any
      # more; `[profile.release]` stays at Cargo's defaults because it is the
      # reference for what a user's own build does, and a compile failure
      # unique to it, given `checked` inherits it, is not a thing that
      # happens.
      - name: cove-bench (correctness only; no threshold gate)
        run: ./target/checked/cove-bench --iterations 1

  # Issue #241 asks for the WebAssembly build to be in CI before the UI that
  # depends on it, so this is a job of its own rather than a step: it fails on
  # its own terms, in parallel with the pipeline above, and a browser
  # playground that no longer builds is reported as that rather than as "the
  # tests are red".
  #
  # It builds the artifact `web/README.md` tells a reader to build, and then
  # runs Cove programs through it under node. That second half is what makes
  # this a check rather than a compile: the module has to instantiate with the
  # clock the page imports, compile a program, run it, refuse a `spawn`
  # because a worker has one thread, and stop a loop at its deadline. Nothing
  # short of executing it establishes any of that.
  wasm:
    name: the browser playground builds and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          rustc --version
          node --version

      # Keyed apart from the job above: this is a second target's artifacts
      # and sharing one key would have the two jobs overwrite each other's.
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-wasm-

      - name: Build the playground for wasm32-unknown-unknown
        run: cargo build -p cove-wasm --target wasm32-unknown-unknown --release

      - name: Run Cove programs through it under node
        run: node web/check.mjs

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A failed build should say what failed, not where in the compiler it failed.
  RUST_BACKTRACE: 1
  # Nothing here builds twice in the same job, so incremental compilation
  # buys no rebuild and costs the cache the artifacts it writes to make one
  # possible. Those are most of what a `target` directory weighs, and the
  # cache below is now written on every run.
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: test, lint, and dogfood
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The runner image ships a current stable toolchain; asking for the two
      # components is a no-op when they are already there and a clear failure
      # when they are not.
      - name: Show the toolchain
        run: |
          rustup component add clippy rustfmt
          rustc --version
          cargo --version
          cargo clippy --version
          cargo fmt --version

      # The two package target directories are cached alongside the
      # workspace's own: `cove build`'s end-to-end test compiles a generated
      # crate under each package it builds from, in a target directory of its
      # own, and without the cache that is a cold release build of the runtime
      # on every run.
      #
      # The key ends in the run id, which is never the same twice, because
      # `actions/cache` writes nothing when the key it was given hits
      # exactly. Keyed on the lockfile alone it therefore saved once — on
      # whichever run first built with that `Cargo.lock` — and every run
      # after it restored that same frozen directory and threw its own work
      # away. A key that always misses always saves, and `restore-keys`
      # takes the most recent one that matches the prefix, which is what
      # the lockfile-keyed entry was meant to be doing all along.
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            examples/target
            tests/e2e/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      # Formatting first: it is the cheapest check and the easiest to fix.
      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The `Pages` workflow publishes these docs with warnings denied, so a
      # broken intra-doc link (or any other doc build failure) is a build
      # failure there whether or not it is caught here first. Running the
      # same check on the PR means it is the PR's author who sees it, not a
      # permanently red `main` that hides the next, genuinely new regression.
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      - name: cargo test
        run: cargo test --workspace

      # The cases `crates/cove-runtime/src/frame/tests.rs` marks `#[ignore]`:
      # the five that drive the `benches/` rows at the 2,000,000 turns the
      # published measurement was taken at. They cost between thirty and fifty
      # seconds each in an unoptimised build, which is a price worth paying
      # once here rather than on every local `cargo test`. The module docs
      # there say why shortening the rows was refused instead.
      #
      # `crates/cove-cli/tests/admits_coverage.rs` is the same trade made by
      # an integration test rather than a unit test, which is why `--lib`
      # alone no longer covers everything `#[ignore]` marks: a target under
      # `tests/` is not part of `--lib`, so a `--lib`-only run would build
      # that test and never execute it. `--tests` beside it picks up every
      # integration test binary's ignored cases too.
      #
      # `--lib --tests` and not `--workspace` alone, because `--ignored`
      # would otherwise reach the doc examples fenced ```ignore, which are
      # marked that way precisely because they do not compile on their own.
      - name: cargo test (the ignored rows)
        run: cargo test --workspace --lib --tests -- --ignored

      # Dogfooding. These are the project's own claims about its own sources:
      # the repository is formatted, the representative programs check, and
      # their tests pass. They are checked with the binary this commit builds.
      - name: Build the cove CLI
        run: cargo build -p cove-cli

      - name: cove fmt --check (repository root)
        run: ./target/debug/cove fmt --check

      - name: cove check (examples)
        working-directory: examples
        run: ../target/debug/cove check

      # `httpstatus/status_code.cove` is checked in, generated by
      # `codegen.statusCodes`; this is what catches it going stale.
      - name: cove generate --check (examples)
        working-directory: examples
        run: ../target/debug/cove generate --check

      - name: cove test (examples)
        working-directory: examples
        run: ../target/debug/cove test

      # The two steps above run on the linear-memory backend, because ADR
      # 0034 makes that what a command that runs a program runs it on. The
      # interpreter is still the oracle, and these are the project's own
      # sources — the first real programs to feel a divergence — so they are
      # run on it too. Both together cost under a second.
      - name: cove generate --check and cove test on the interpreter (examples)
        working-directory: examples
        run: |
          ../target/debug/cove generate --check --backend ast
          ../target/debug/cove test --backend ast

      # ADR 0012's performance-gate harness. Wall-clock numbers are too
      # noisy on a shared runner for a threshold to mean anything, so this
      # runs the harness for correctness only: every benchmark executes,
      # every metric it names comes back well-formed, and the process exits
      # 0. Reading the numbers for a real measurement is a local exercise,
      # documented in ADR 0012.
      #
      # Optimized, and once, because none of that needs a slow run to
      # establish. The benchmarks are sized to be measurable in an
      # optimized build — `benches/arith` turns a loop two million times —
      # and this step ran them unoptimized, three times each, with the
      # traced and untraced runs `trace_overhead` needs on top: nine
      # executions of every benchmark, each written to take a while. It
      # cost 422 seconds of a 514-second run, which is 82% of a pipeline
      # spent on the one step that asserts nothing. An optimized build runs
      # `arith` 7.6x faster and one iteration is three times fewer, and
      # neither changes any of the three things above.
      # The CLI as well, and in the same profile: the `startup` benchmark
      # measures a real process, so it spawns the `cove` binary beside
      # itself rather than calling into the runtime in-process, and an
      # optimized harness looks for an optimized one. The debug build above
      # stays, because the dogfooding steps run against the binary this
      # commit builds and that is what they have always meant.
      #
      # `--release`, not the workspace's `bench-stable` profile. That profile
      # exists only to hold a recorded negative result (issue #179: one
      # codegen unit per crate did not reduce layout sensitivity and cost 44%
      # to 96% more build time), and selecting it here would spend that build
      # time on a step that asserts no number. `[profile.release]` is left at
      # Cargo's defaults for the same reason this step is one iteration.
      - name: Build cove-bench
        run: cargo build --release -p cove-cli -p cove-bench

      - name: cove-bench (correctness only; no threshold gate)
        run: ./target/release/cove-bench --iterations 1

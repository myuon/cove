name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A failed build should say what failed, not where in the compiler it failed.
  RUST_BACKTRACE: 1
  # Nothing here builds twice in the same job, so incremental compilation
  # buys no rebuild and costs the cache the artifacts it writes to make one
  # possible. Those are most of what a `target` directory weighs, and the
  # cache below is now written on every run.
  CARGO_INCREMENTAL: 0

# Every cargo invocation in the job below runs under `checked`, and that is
# the point rather than a detail. `[profile.checked]` inherits `release` and
# turns `debug-assertions` and `overflow-checks` back on, so it is an
# optimised build with every check the unoptimised one has — and this suite
# *runs Cove programs* rather than merely compiling a harness, so optimisation
# is most of what it costs. One profile also means one dependency graph is
# built instead of two: the job used to compile the workspace unoptimised for
# the tests and again optimised for the benchmark harness.

jobs:
  checks:
    name: test, lint, and dogfood (work)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The runner image ships a current stable toolchain; asking for the two
      # components is a no-op when they are already there and a clear failure
      # when they are not.
      - name: Show the toolchain
        run: |
          rustup component add clippy rustfmt
          rustc --version
          cargo --version
          cargo clippy --version
          cargo fmt --version

      # The two package target directories are cached alongside the
      # workspace's own: `cove build`'s end-to-end test compiles a generated
      # crate under each package it builds from, in a target directory of its
      # own, and without the cache that is a cold release build of the runtime
      # on every run.
      #
      # The key ends in the run id, which is never the same twice, because
      # `actions/cache` writes nothing when the key it was given hits
      # exactly. Keyed on the lockfile alone it therefore saved once — on
      # whichever run first built with that `Cargo.lock` — and every run
      # after it restored that same frozen directory and threw its own work
      # away. A key that always misses always saves, and `restore-keys`
      # takes the most recent one that matches the prefix, which is what
      # the lockfile-keyed entry was meant to be doing all along.
      - name: Cache cargo registry and target
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            examples/target
            tests/e2e/target
          # Every Rust source, every manifest, the lockfile and the cargo
          # config. A key that holds all of them means an *exact* hit is a
          # promise: these artifacts were built from these bytes.
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/*.rs', '**/Cargo.toml', 'Cargo.lock', '.cargo/**') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # `actions/cache` reports `cache-hit` true only for the exact key, and
      # the exact key holds a hash of every Rust source in the tree. So a
      # `true` here is a proof, not a belief: this `target/` was saved by a run
      # whose Rust was byte for byte the Rust being checked now, and dating the
      # sources back so cargo skips them cannot skip anything real.
      #
      # That proof is the whole difference from what issue #306 removed. The
      # step before this one kept a manifest *the job wrote about itself*,
      # before the build rather than after, and a later job on a different
      # commit trusted it — so a run could link artifacts that were not its
      # own, and did, deterministically, on every pull request that did not
      # touch `cove-ir`. Here the claim is the cache key, which no job can
      # write about itself.
      #
      # A miss restores whatever `restore-keys` finds and dates nothing back.
      # The registry and the dependency artifacts are still warm — a
      # dependency's fingerprint is its version and its features rather than a
      # timestamp, and `actions/checkout` does not touch `~/.cargo` — so what
      # a miss costs is the workspace and not the world.
      - name: Date the sources back, on an exact hit only
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          git ls-files -z | xargs -0 touch -d '2000-01-01T00:00:00Z'
          echo "the cache is this commit's Rust; cargo has nothing to rebuild"

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --profile checked -- -D warnings

      # The `Pages` workflow publishes these docs with warnings denied, so a
      # broken intra-doc link (or any other doc build failure) is a build
      # failure there whether or not it is caught here first. Running the
      # same check on the PR means it is the PR's author who sees it, not a
      # permanently red `main` that hides the next, genuinely new regression.
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --profile checked

      # Split from the doc examples below so that the log says which of the
      # two cost what. They are different things that `cargo test --workspace`
      # runs together: this is the suite, and it is the half that *runs Cove
      # programs* and so is the half optimisation is for.
      - name: cargo test
        run: cargo test --workspace --lib --bins --tests --profile checked

      # The doc examples. Each fenced example compiles as a crate of its own,
      # so this half is compilation rather than execution and behaves the
      # opposite way under a profile — which is exactly why it is a step of
      # its own rather than a number folded into the one above.
      - name: cargo test (the doc examples)
        run: cargo test --workspace --doc --profile checked

      # Dogfooding. These are the project's own claims about its own sources:
      # the repository is formatted, the representative programs check, and
      # their tests pass. They are checked with the binary this commit builds.
      #
      # `cove-bench` is built here beside the CLI rather than in a step of its
      # own further down, because in one profile they are one build. It also
      # has to be the same profile as the CLI whichever one is chosen: the
      # `startup` benchmark measures a real process, so it spawns the `cove`
      # binary beside itself rather than calling into the runtime in-process.
      - name: Build the cove CLI and the benchmark harness
        run: cargo build --profile checked -p cove-cli -p cove-bench

      - name: cove fmt --check (repository root)
        run: ./target/checked/cove fmt --check

      # `docs/BUILTINS.md` and `docs/builtins.json` are the contents of
      # `crates/cove-schema`, written out. This is what stops them becoming a
      # second table that says something else.
      - name: cove reference --check (repository root)
        run: ./target/checked/cove reference --check

      - name: cove check (examples)
        working-directory: examples
        run: ../target/checked/cove check

      # `httpstatus/status_code.cove` is checked in, generated by
      # `codegen.statusCodes`; this is what catches it going stale.
      - name: cove generate --check (examples)
        working-directory: examples
        run: ../target/checked/cove generate --check

      - name: cove test (examples)
        working-directory: examples
        run: ../target/checked/cove test

      # The two steps above run on the linear-memory backend, because ADR
      # 0034 makes that what a command that runs a program runs it on. The
      # interpreter is still the oracle, and these are the project's own
      # sources — the first real programs to feel a divergence — so they are
      # run on it too. Both together cost under a second.
      - name: cove generate --check and cove test on the interpreter (examples)
        working-directory: examples
        run: |
          ../target/checked/cove generate --check --backend ast
          ../target/checked/cove test --backend ast

      # covefmt is a package of its own (issue 556), so the `examples` steps
      # above no longer reach it. The same checks, on both backends; it
      # generates nothing, so there is no `generate --check` to run.
      - name: cove check (tools/covefmt)
        working-directory: tools/covefmt
        run: ../../target/checked/cove check

      - name: cove test (tools/covefmt)
        working-directory: tools/covefmt
        run: ../../target/checked/cove test

      - name: cove test on the interpreter (tools/covefmt)
        working-directory: tools/covefmt
        run: ../../target/checked/cove test --backend ast

      # ADR 0012's performance-gate harness. Wall-clock numbers are too
      # noisy on a shared runner for a threshold to mean anything, so this
      # runs the harness for correctness only: every benchmark executes,
      # every metric it names comes back well-formed, and the process exits
      # 0. Reading the numbers for a real measurement is a local exercise,
      # documented in ADR 0012.
      #
      # Optimized, and once, because none of that needs a slow run to
      # establish. The benchmarks are sized to be measurable in an
      # optimized build — `benches/arith` turns a loop two million times —
      # and this step ran them unoptimized, three times each, with the
      # traced and untraced runs `trace_overhead` needs on top: nine
      # executions of every benchmark, each written to take a while. It
      # cost 422 seconds of a 514-second run, which is 82% of a pipeline
      # spent on the one step that asserts nothing. An optimized build runs
      # `arith` 7.6x faster and one iteration is three times fewer, and
      # neither changes any of the three things above.
      #
      # `checked` rather than `release`, which is the whole of what this step
      # gave up to make the job one profile. It is not free and it is close
      # to it: measured locally, `cove-bench --iterations 1` is 37.6s under
      # `checked` against 36.0s under `release`, which is the overflow checks
      # costing 4%. What it buys is the 30s build of a second copy of the
      # workspace, which no longer happens — the binaries this step wants
      # were built by the dogfooding step above.
      #
      # Neither is the workspace's `bench-stable` profile. That exists only
      # to hold a recorded negative result (issue #179: one codegen unit per
      # crate did not reduce layout sensitivity and cost 44% to 96% more
      # build time), and selecting it here would spend that build time on a
      # step that asserts no number. Nothing in this job builds `release` any
      # more; `[profile.release]` stays at Cargo's defaults because it is the
      # reference for what a user's own build does, and a compile failure
      # unique to it, given `checked` inherits it, is not a thing that
      # happens.
      - name: cove-bench (correctness only; no threshold gate)
        run: ./target/checked/cove-bench --iterations 1

  # The native tier against the VM on a real program, and ADR 0055's gate
  # item 7 from the other side: a `cove` built *without* the tier.
  #
  # Since ADR 0076 `cove-cli` builds the template compiler by default, so the
  # `checks` job's workspace clippy, doc and test already compile and run it —
  # `cove-native`'s suite, `cove-runtime`'s `native_tier.rs` and every other
  # case gated on `template` — by feature unification. This job used to repeat
  # those three commands with `--features template` on `cove-native`, and on
  # `cove-runtime` and `cove-cli`, because the default build reached none of
  # it; they now ran the same tests under the same features twice, and are
  # gone. What is left is what no workspace command does: the covefmt corpus
  # diffed across tiers, and a build with the feature turned *off*. Both build
  # a binary of their own, so they stay off the serial path through `checks`.
  native:
    name: the native tier agrees with the VM, and the VM stands without it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: |
          rustup component add clippy
          rustc --version
          cargo --version
          cargo clippy --version

      - name: Cache cargo registry and target
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            examples/target
            tests/e2e/target
          key: ${{ runner.os }}-cargo-native-${{ hashFiles('**/*.rs', '**/Cargo.toml', 'Cargo.lock', '.cargo/**') }}
          restore-keys: |
            ${{ runner.os }}-cargo-native-
            ${{ runner.os }}-cargo-

      - name: Date the sources back, on an exact hit only
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          git ls-files -z | xargs -0 touch -d '2000-01-01T00:00:00Z'
          echo "the cache is this commit's Rust; cargo has nothing to rebuild"

      # Run the repository's formatter corpus on machine code and require it
      # to print exactly what the encoded VM prints. Neither stderr stream is
      # hidden, so a backend failure remains diagnosable from the CI log.
      #
      # A plain build, with no `--features template`: that the default `cove`
      # has the tier is ADR 0076's decision, and this is where it is relied on.
      - name: cove run covefmtBench on the native tier, against the VM
        run: |
          set -euo pipefail
          cargo build --profile checked -p cove-cli
          cd tools/covefmt
          strip_timings() { grep -v '^lex\|^parse\|^print\|^whole'; }
          ../../target/checked/cove run covefmtBench --files-root ../.. --backend vm \
            | strip_timings > /tmp/covefmt-vm.out
          ../../target/checked/cove run covefmtBench --files-root ../.. --backend native \
            | strip_timings > /tmp/covefmt-native.out
          diff /tmp/covefmt-vm.out /tmp/covefmt-native.out
          echo "the native tier printed what the encoded VM printed, byte for byte"

      # ADR 0055's gate item 7, second half: "a build without the native
      # feature ... retains the full VM corpus". `cove-cli` turns the feature on
      # by default (ADR 0076), so this is the one place a `cove` without it is
      # built at all. The end-to-end suite is the corpus that runs through the
      # *binary* — it spawns the `cove` this command built, over every case in
      # `tests/e2e/`, on the linear-memory backend and against the interpreter
      # — and its native comparisons are `cfg!(feature = "template")`, so they
      # drop out rather than fail. It replaces `target/checked/cove` with the
      # featureless build, which is why it comes after the step above.
      - name: cove-cli without the native feature passes the end-to-end corpus
        run: cargo test -p cove-cli --no-default-features --profile checked --test e2e

  # The `#[ignore]`d cases are the full coverage/ratchet gate. In particular,
  # `vm_coverage.rs` runs every program in the repository, including benchmark
  # rows with two million turns. It is the longest single check, and it shares
  # no mutable state or output with the lint, ordinary-test and dogfood gate,
  # so making it a separate job lets the two run concurrently without dropping
  # or weakening either one.
  ratchet:
    name: the ignored coverage and ratchet rows pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: |
          rustc --version
          cargo --version

      # This job writes a target tree independently of `checks`. Keep its key
      # separate so two concurrent jobs never contend for the same cache entry.
      # The broad fallback can seed the first run from the former shared cache;
      # subsequent runs prefer the latest ratchet-specific tree.
      - name: Cache cargo registry and target
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            examples/target
            tests/e2e/target
          key: ${{ runner.os }}-cargo-ratchet-${{ hashFiles('**/*.rs', '**/Cargo.toml', 'Cargo.lock', '.cargo/**') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ratchet-
            ${{ runner.os }}-cargo-

      - name: Date the sources back, on an exact hit only
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          git ls-files -z | xargs -0 touch -d '2000-01-01T00:00:00Z'
          echo "the cache is this commit's Rust; cargo has nothing to rebuild"

      # This is `cargo ratchet`, character for character. `--lib --tests`
      # deliberately excludes doc examples fenced ```ignore while including
      # integration-test targets under `tests/`.
      - name: cargo test (the ignored rows)
        run: cargo test --workspace --lib --tests --profile checked -- --ignored

  # Preserve the existing required-check name while the three arms execute
  # concurrently. Moving work out of the old job must not make a red arm
  # optional under the repository's existing branch rule.
  build:
    name: test, lint, and dogfood
    if: always()
    needs: [checks, native, ratchet]
    runs-on: ubuntu-latest
    steps:
      - name: Every arm passed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          RATCHET_RESULT: ${{ needs.ratchet.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$NATIVE_RESULT" = success
          test "$RATCHET_RESULT" = success

  # Issue #241 asks for the WebAssembly build to be in CI before the UI that
  # depends on it, so this is a job of its own rather than a step: it fails on
  # its own terms, in parallel with the pipeline above, and a browser
  # playground that no longer builds is reported as that rather than as "the
  # tests are red".
  #
  # It builds the artifact `web/README.md` tells a reader to build, and then
  # runs Cove programs through it under node. That second half is what makes
  # this a check rather than a compile: the module has to instantiate with the
  # clock the page imports, compile a program, run it, refuse a `spawn`
  # because a worker has one thread, and stop a loop at its deadline. Nothing
  # short of executing it establishes any of that.
  wasm:
    name: the browser playground builds and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          rustc --version
          node --version

      # Keyed apart from the job above: this is a second target's artifacts
      # and sharing one key would have the two jobs overwrite each other's.
      # Keyed apart from the job above — a second target's artifacts, and
      # sharing one key would have the two jobs overwrite each other's — and
      # keyed on the same sources, for the reason that job's comment gives.
      - name: Cache cargo registry and target
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/*.rs', '**/Cargo.toml', 'Cargo.lock', '.cargo/**') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Date the sources back, on an exact hit only
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          git ls-files -z | xargs -0 touch -d '2000-01-01T00:00:00Z'
          echo "the cache is this commit's Rust; cargo has nothing to rebuild"

      # ADR 0055's gate item 7, first half: "a build without the native
      # feature has no executable-memory dependency". The playground is the
      # build that must not have one, and since ADR 0076 turned the feature on
      # in `cove-cli` a default somewhere could pull it in. `--target all`
      # rather than `wasm32-unknown-unknown`, because `libc` is a `cfg(unix)`
      # dependency of `cove-native` and a wasm-only graph would omit it even
      # if the feature were on — the check would pass on exactly the mistake it
      # exists for. So it also refuses `cove-native` with `template` itself.
      - name: The playground's dependency graph has no code generator and no libc
        run: |
          set -euo pipefail
          tree=$(cargo tree -p cove-wasm --target all -e normal --prefix none -f '{p} {f}')
          if printf '%s\n' "$tree" | grep -E '^libc |^cove-native .*[ ,]template(,|$)'; then
            echo "::error::cove-wasm's graph reaches the native code generator (ADR 0055 gate item 7, ADR 0076)"
            exit 1
          fi
          echo "cove-wasm's graph has no libc and no template feature"

      - name: Build the playground for wasm32-unknown-unknown
        run: cargo build -p cove-wasm --target wasm32-unknown-unknown --release

      - name: Run Cove programs through it under node
        run: node web/check.mjs

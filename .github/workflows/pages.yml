name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# `deploy-pages` needs `pages: write` to publish and `id-token: write` to
# prove to the Pages service that the artifact came from this workflow run.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build the API documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-doc-
            ${{ runner.os }}-cargo-

      # `--no-deps` keeps the five crates that matter from being buried under
      # `toml` and its transitive dependencies. `-D warnings` makes a broken
      # intra-doc link fail the build instead of shipping a dead link.
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        # The restored cache may hold a previous run's `target/doc`, and
        # rustdoc does not remove what it no longer generates, so a deleted
        # crate would otherwise stay on the site.
        run: |
          rm -rf target/doc
          cargo doc --workspace --no-deps

      # rustdoc writes no `index.html` at the root of `target/doc`, so without
      # this a visitor to the site's root gets a 404. The page is generated
      # from `cargo metadata` and each crate's first `//!` line, so adding a
      # crate or rewording its module doc updates it with no edit here.
      - name: Generate the landing page
        run: |
          set -euo pipefail
          doc=target/doc
          targets=$(cargo metadata --format-version 1 --no-deps | jq -r '
            .workspace_members as $w
            | .packages
            | sort_by(.id as $id | $w | index($id))
            | .[]
            | .targets[]
            | select(.doc)
            | [.name, .src_path]
            | @tsv')
          {
            cat <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Cove API documentation</title>
          <style>
            :root { color-scheme: light dark; }
            body {
              margin: 0 auto; padding: 3rem 1.5rem; max-width: 46rem; line-height: 1.6;
              font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            }
            h1 { margin-bottom: 0.25rem; }
            p.lede { margin-top: 0; opacity: 0.75; }
            ul { list-style: none; padding: 0; }
            li { padding: 0.9rem 0; border-top: 1px solid rgba(127, 127, 127, 0.3); }
            li a, li a code { font-size: 1.05rem; }
            li a { text-decoration: none; }
            li span { display: block; opacity: 0.8; }
            footer { margin-top: 2.5rem; font-size: 0.9rem; opacity: 0.7; }
          </style>
          </head>
          <body>
          <h1>Cove API documentation</h1>
          <p class="lede">
            Rust API documentation for the crates that implement
            <a href="https://github.com/myuon/cove">Cove</a>, generated by
            <code>cargo doc --workspace --no-deps</code>.
          </p>
          <ul>
          HTML
            while IFS=$(printf '\t') read -r name src; do
              [ -n "$name" ] || continue
              desc=$(head -n 1 "$src" | sed -n 's|^//! \{0,1\}||p' \
                | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' \
                      -e 's|`\([^`]*\)`|<code>\1</code>|g')
              printf '  <li><a href="%s/index.html"><code>%s</code></a><span>%s</span></li>\n' \
                "$name" "$name" "$desc"
            done <<EOF
          $targets
          EOF
            cat <<HTML
          </ul>
          <footer>Built from <code>$GITHUB_SHA</code>.</footer>
          </body>
          </html>
          HTML
          } > "$doc/index.html"

      # A link that does not resolve against the real output is a broken site,
      # so check it here rather than after deploying.
      - name: Check the landing page links
        run: |
          set -euo pipefail
          status=0
          for href in $(grep -o 'href="[^"]*index\.html"' target/doc/index.html \
            | sed 's/href="//; s/"$//'); do
            if [ -f "target/doc/$href" ]; then
              echo "ok   $href"
            else
              echo "missing   $href"
              status=1
            fi
          done
          exit $status

      # Everything above runs on pull requests too, so a broken doc build is
      # caught in review. Only a push to `main` publishes.
      # The three Pages actions are pinned to their current majors: they are
      # released as a set, and the older `v4`s predate the Node 24 runner.
      - name: Configure Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v6

      - name: Upload the documentation artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/doc

  deploy:
    name: deploy to GitHub Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

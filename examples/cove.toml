[run.hello]
entry = "hello.main"
allow = ["console"]

[run.config]
entry = "config.loadConfig"
allow = ["env"]

[run.server]
entry = "server.main"
allow = ["network", "console"]

[run.restricted]
entry = "restricted.main"
allow = ["documents", "console"]

[run.traits]
entry = "traits.main"
allow = ["console"]

[run.tasks]
entry = "tasks.loadDashboard"
allow = ["network", "clock"]

[run.values]
entry = "values.main"
allow = ["console"]

[run.callbacks]
entry = "callbacks.main"
allow = ["network", "database", "clock", "console"]

[run.statusCodes]
entry = "codegen.statusCodes"
allow = ["files"]
generates = "httpstatus/status_code.cove"

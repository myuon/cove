[run.hello]
entry = "hello.main"
allow = ["console"]

[run.config]
entry = "config.loadConfig"
allow = ["env"]

[run.server]
entry = "server.main"
allow = ["http", "console"]

[run.restricted]
entry = "restricted.main"
allow = ["documents", "console"]

[run.traits]
entry = "traits.main"
allow = ["console"]

[run.tasks]
entry = "tasks.loadDashboard"
allow = ["http", "clock"]

[run.values]
entry = "values.main"
allow = ["console"]

[run.callbacks]
entry = "callbacks.main"
allow = ["http", "database", "clock", "console"]

[run.cq]
entry = "cq.main"
allow = ["console", "files", "process"]

[run.cqSample]
entry = "cq.sample"
allow = ["console", "files", "process"]

[run.covecheck]
entry = "covecheck.main"
allow = ["console", "files", "http", "clock"]

[run.statusCodes]
entry = "codegen.statusCodes"
allow = ["files"]
generates = "httpstatus/status_code.cove"

[run.reviewPolicy]
entry = "rules.main"
allow = ["console"]

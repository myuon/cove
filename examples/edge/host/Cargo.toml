[package]
name = "cove-edge"
version.workspace = true
edition.workspace = true
license.workspace = true
# `cargo run -p cove-edge` starts the server rather than asking which binary.
default-run = "cove-edge"

[[bin]]
name = "cove-edge"
path = "src/main.rs"

[[bin]]
name = "cove-edge-load"
path = "src/bin/load.rs"

[[bin]]
name = "cove-edge-timeline"
path = "src/bin/timeline.rs"

[[bin]]
name = "cove-edge-compare"
path = "src/bin/compare.rs"

[features]
# The native tier's code generator: what `cove-edge --backend native` runs
# its isolates on (ADR 0085), and `cove-edge-compare`'s native rows (stage 1
# of `compare/README.md`). Off by default, as it is in `cove-runtime`, so the
# default server has no executable-memory dependency and runs encoded. A
# workspace build turns it on anyway, through `cove-cli`'s default `template`
# (ADR 0076).
native = ["cove-runtime/template"]

[dependencies]
cove-diag.workspace = true
cove-ir.workspace = true
cove-runtime.workspace = true
cove-schema.workspace = true
cove-sema.workspace = true
cove-syntax.workspace = true
# `tenants/edge.toml`, the server's own per-tenant policy (the fetch
# allowlist), which `cove.toml`'s strict parser has no room for. The version
# and features `cove-sema` already uses, so nothing new is built.
toml = { version = "0.8", default-features = false, features = ["parse"] }

# `setrlimit`, so that ten thousand sockets fit under the open-file limit
# without a `ulimit -n` first, and `getrusage` for peak RSS. Already in the
# lock file through `cove-native`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The tests compile the native tier whatever the build asked for, so that
# `tests/server.rs`'s native-backend case runs under `cargo test -p cove-edge`
# as well as under the workspace's `cargo t` (where `cove-cli` turns it on).
# A dev-dependency's features reach test builds only.
[dev-dependencies]
cove-runtime = { workspace = true, features = ["template"] }

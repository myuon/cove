# The mechanism benchmarks. Each is the same 2,000,000-iteration loop as
# `arith` with exactly one mechanism added, so the difference between two of
# them is what that mechanism costs. Issue #104 added them: `examples/cq`
# said the interpreted per-character loop was 99% of a real run, and these are
# where that claim is decomposed into the operations it is made of.

[run.arith]
entry = "arith.main"
allow = []

[run.arrayget]
entry = "arrayget.main"
allow = []

[run.field]
entry = "field.main"
allow = []

[run.method]
entry = "method.main"
allow = []

[run.call]
entry = "call.main"
allow = []

[run.chars]
entry = "chars.main"
allow = []

# The same 2,000,000 invocations `call` makes, reached through a higher-order
# builtin's callback rather than through the call instruction. Issue #193
# added it: `map`, `filter`, `fold` and `sorted` are the only way a builtin
# runs Cove code, and no row priced that route.

[run.callback]
entry = "callback.main"
allow = []

# The calling-convention matrix. Issue #123 asks what each boundary of the
# typed three-stack convention costs, so each of these is `arith`'s loop with
# exactly one route from the turn's `i` to the arithmetic that consumes it.
# `cove-bench --matrix` runs them; the ordinary suite does not, because they
# answer a question about one backend rather than compare two.

[run.conv_local]
entry = "convention.scalarLocal"
allow = []

[run.conv_var]
entry = "convention.varRooted"
allow = []

[run.conv_static]
entry = "convention.staticCall"
allow = []

[run.conv_fnvalue]
entry = "convention.fnValue"
allow = []

[run.conv_closure]
entry = "convention.closureCall"
allow = []

[run.conv_capture]
entry = "convention.capturedScalar"
allow = []

[run.conv_generic]
entry = "convention.genericCall"
allow = []

[run.conv_fresh]
entry = "convention.freshClosure"
allow = []

[run.conv_host]
entry = "convention.hostReentry"
allow = ["clock"]

# `chars`'s loop written against the byte-counted primitives instead — issue
# #292. `bytescan` writes the scalar's width out and `bytescan_call` puts it
# behind a function, so the pair separates what the primitive costs from what
# a call in the loop costs.

[run.bytescan]
entry = "bytescan.main"
allow = []

[run.bytescan_call]
entry = "bytescan.viaCall"
allow = []

# `contains` and `Int.parse` written in Cove against the byte-counted
# primitives, beside the builtins they would replace — issue #292. `main` is
# the agreement check; the five rows are the measurement.

[run.stringlib]
entry = "stringlib.main"
allow = []

[run.contains_builtin]
entry = "stringlib.containsBuiltinRow"
allow = []

[run.contains_scalar]
entry = "stringlib.containsScalarRow"
allow = []

[run.contains_slice]
entry = "stringlib.containsSliceRow"
allow = []

[run.parse_builtin]
entry = "stringlib.parseBuiltinRow"
allow = []

[run.parse_cove]
entry = "stringlib.parseCoveRow"
allow = []

# What one `Inst::IntrinsicCall` costs, decomposed. Three loops over the same
# 2,000,000 turns as `arith`, each with exactly one builtin in it, and a
# fourth with none: the difference between the bare loop and one of the others
# is that builtin's whole cost — the operand copy, the dispatch, the work, and
# the words coming home.
#
# The three are not interchangeable. `byteLength` answers one word,
# `codePointAtByte` answers an `Option` the machine assembles, and
# `sliceBytes` answers a `Result` carrying a heap object it allocates, so the
# three rows price the call, the wrapper and the allocation apart.
[run.builtincall]
entry = "builtincall.main"
allow = ["console", "clock"]

[run.scanshape]
entry = "scanshape.main"
allow = ["console", "clock"]

# What `String.endsWith` costs on its own, at the four pairs of receiver and
# suffix size — ADR 0064's Phase 1 moved it out of the runtime and into
# `std.string.endsWith`, and the operation's own cost is what Decision 8 asks
# a migration to record. A bare-loop control row is beside them, so each
# figure is a per-call cost taken by difference, and the loop is in a callee
# so that the row means the same thing under `--backend native`, where the
# outermost frame is always encoded.

[run.endswith]
entry = "endswith.main"
allow = ["console", "clock"]

# The same four rows for `String.startsWith`, in a package of its own rather
# than four more rows in `endswith`: the two are the same loop with a
# different offset, and one package per operation keeps a row attributable to
# the operation the package is named for. What it gives up is the shared
# bare-loop control that would have made the two directly comparable inside
# one process; the sizes are deliberately `endswith`'s, so the comparison can
# still be taken across the two, knowing it costs a code layout.

[run.startswith]
entry = "startswith.main"
allow = ["console", "clock"]

# What `String.contains` costs against what the same search costs in Cove, at
# nine combinations of receiver length, needle length and match position —
# issue #442, and ADR 0065's third adoption gate. `contains` is the operation a
# bounded run-search primitive was justified on, and it now has one: the first
# column is `std.string.contains`, one `Inst::RunFind` a call, where it was one
# mediated `Inst::IntrinsicCall` when this package was written. The three arms
# are run over the same strings in one process: that one, `benches/stringlib`'s
# scalar scan, and the byte scan the two migrated predicates are written as.

[run.contains]
entry = "contains.main"
allow = ["console", "clock"]

# What turning a byte offset into a character position costs — ADR 0064's
# fifth Phase 1 migration, `String.indexOf`. The search under it is
# `benches/contains`' subject and is measured there; what this package adds is
# the walk of the text in front of what the search found. Every row is run
# twice over the same receiver and needle, once as `indexOf` and once as
# `contains`, which make the same `Inst::RunFind` and differ only in the walk
# and the `Option` around its answer — so the conversion is a difference of
# two columns rather than a column, which is the only way to read it apart
# from the search.

[run.indexof]
entry = "indexof.main"
allow = ["console", "clock"]

# What `Float.abs` costs as an instruction against what it cost as a call —
# ADR 0064's sixth Phase 1 migration. The operation runs zero times on covefmt
# and on cq, so there is no whole-program figure to take and this package is
# the whole of the performance argument. The two arms cannot be written in one
# process, because one of them no longer exists: the same source is run by a
# `cove` built either side of the migration, and the difference between the two
# runs is the operation and nothing else.

[run.floatabs]
entry = "floatabs.main"
allow = ["console", "clock"]

# `Float.min` and `Float.max` as an instruction against the same two as a
# call, which is ADR 0064's last two Phase 1 migrations. `benches/floatabs`'
# arrangement — the loop in a padded callee, the control with nothing in it,
# two binaries over one source — with four operand pairs per operation
# instead of three operands, because this operation chooses between its
# operands and the rows are what say the choice is branch-free.
[run.floatminmax]
entry = "floatminmax.main"
allow = ["console", "clock"]

# `Float.round` as an instruction against the same operation as a call, which
# is ADR 0064's Decision 2 typed scalar operation applied to the third of the
# three names it lists. `benches/floatminmax`' arrangement — the loop in a
# padded callee, the control with nothing in it, two binaries over one source
# — with five operands instead of four pairs, because the native lowering is
# seventeen instructions with a `cmov` in the middle and the rows are what say
# the selection is branch-free.
[run.floatround]
entry = "floatround.main"
allow = ["console", "clock"]

# `Float.sqrt` as an instruction against the same operation as a call, which
# is ADR 0064's Decision 2 typed scalar operation applied to the last of the
# three names it lists. `benches/floatround`' arrangement for its reasons, with
# five operands chosen for a different question: `sqrtsd` is one instruction
# and is the only one of the four lowerings whose own latency is in the teens
# of cycles, so the rows ask whether an exact root, an inexact one, an invalid
# operation and a subnormal cost the same.
[run.floatsqrt]
entry = "floatsqrt.main"
allow = ["console", "clock"]

# `contains` and `indexOf` over `Array<Int>`, `Vector<Int>`, `Array<String>`
# and a two-word struct element, found and not found, at n = 8 and n = 1024 —
# #378's Phase 3 Q10. Both searches move from Rust into a Cove loop over `==`,
# and these rows are what says whether that is a constant factor or a change
# of class. The first argument is how many element comparisons each row
# spends; `seqsearch/args` makes it a test's size for the corpus surveys.

[run.seqsearch]
entry = "seqsearch.main"
allow = ["console", "clock"]

# `Map` and `Set` lookups, updates and literals, one keyed mechanism a row —
# #378's Phase 4 (ADR 0059). Lookups and updates move from a Rust binary
# search into a Cove one over a layout-directed value order, and these rows
# are what says whether that is a constant factor on the mechanism. The first
# argument is how many turns a lookup row takes; `keyed/args` makes it a
# test's size for the corpus surveys.

[run.keyed]
entry = "keyed.main"
allow = ["console", "clock"]

# `String.slice` at the receiver lengths and character widths that separate a
# walk of the lead bytes from a collection of the whole receiver into a
# `Vec<char>` — ADR 0064 and issue #454's Step 3. The census measured this
# operation at 0 sites and 0 calls on both representative programs, so no
# whole-program figure can price the migration and these rows are the whole of
# what it has. The pair that carries the question is `long.head` against
# `short.head`: the same five-character answer off a receiver five times as
# long.

[run.slice]
entry = "slice.main"
allow = ["console", "clock"]

# `String.fromCodePoint` at each of the four widths it encodes to and on each
# of the two ways it refuses — ADR 0064 and issue #454's Step 3. The census
# measured this operation at 0 sites and 0 calls on both representative
# programs, so no whole-program figure can price the migration and these rows
# are the whole of what it has. There is no receiver and nothing proportional
# to one: the argument is an `Int` word, so the encoding width is the only axis
# there is, and `one` against `two` is where `finish()`'s UTF-8 validation
# stops taking its ASCII fast path.

[run.frompoint]
entry = "frompoint.main"
allow = ["console", "clock"]

# `String.join` at four part counts, two separators and two part widths — ADR
# 0064 and issue #454's Step 3. **This is the first package in the series whose
# operation a representative program runs**, so unlike `slice`, `frompoint` and
# the six `Float` rows above it these rows are not the whole of the
# measurement: `examples/covefmt` calls `join` 8,742 times over 1,465,687
# parts, and the whole-program figures are in the commit that moved it. What
# these rows add is the decomposition — `sixtyfour` against `two` is the slope
# a part costs, `empty` against `one` is the fixed cost on its own, and
# `eight.ascii` against `eight.utf8` is `finish()`'s UTF-8 validation falling
# off its word-scan over the same 334 bytes.

[run.join]
entry = "join.main"
allow = ["console", "clock"]

# `chars`'s decomposition — issue #454's Step 3, which moved `String.chars`
# into `std.string.chars`. `[run.chars]` above is one receiver at 32,000
# rounds and is one of `cove-bench`'s nine timed rows; this is the matrix of
# receiver length against encoding width beside it, which is what separates a
# cost per character from a cost per byte. It is a second entry of the same
# package for the reason `bytescan_call` is: the two ask one question between
# them and the row `cove-bench` reports must not move when the second arrives.

[run.chars_rows]
entry = "chars.rows"
allow = ["console", "clock"]

[workspace]
resolver = "2"
members = [
  "crates/cove-diag",
  "crates/cove-schema",
  "crates/cove-syntax",
  "crates/cove-sema",
  "crates/cove-ir",
  "crates/cove-lir",
  "crates/cove-runtime",
  "crates/cove-cli",
  "crates/cove-bench",
  # The embedding half of `examples/rules`: a Rust host that compiles the
  # rule package once and invokes it many times. It is a workspace member so
  # that `cargo test --workspace` runs its tests and `cargo clippy` sees it,
  # which is what keeps an example of the embedding API from rotting against
  # the API it is an example of.
  "examples/rules/host",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/myuon/cove"

[workspace.dependencies]
cove-diag = { path = "crates/cove-diag" }
cove-schema = { path = "crates/cove-schema" }
cove-syntax = { path = "crates/cove-syntax" }
cove-sema = { path = "crates/cove-sema" }
cove-ir = { path = "crates/cove-ir" }
cove-lir = { path = "crates/cove-lir" }
cove-runtime = { path = "crates/cove-runtime" }

# A bench-only profile, kept for reproducing the measurement below and NOT
# recommended as the baseline for implementation comparisons. Read
# `docs/VM_ARCHITECTURE.md`, "What `codegen-units = 1` was measured to be
# worth", before using it for anything.
#
# `[profile.release]` is deliberately absent and stays absent. Release is the
# reference for distribution performance -- what a user's build does, at
# Cargo's defaults -- and it is what CI builds, which is why CI's pipeline
# keeps the 137 seconds it was cut to rather than the 514 it came from.
#
# `codegen-units = 1` is the whole of this profile. The hope
# ([issue #179](https://github.com/myuon/cove/issues/179), option 2) was that
# compiling each crate as one codegen unit would stop module boundaries from
# being a performance variable, since rustc partitions codegen units by
# module. It was measured against the control #179 asks for -- a dead `Inst`
# variant that is never emitted and never executed -- and it did not do that.
# The spurious shift was *larger* under this profile than under plain release
# in the same session, and both were inside the drift the same binary shows
# against itself. The build costs 44% more from scratch and 96% more
# incrementally. So this is a recorded negative result, not a tool to reach
# for.
#
# No LTO here. That was always a separate measurement, and on this evidence it
# needs a different experiment design before it is worth running at all.
#
# If you do run it, both binaries must be built under it, because
# `cove-bench`'s `startup` benchmark spawns the `cove` binary beside itself:
#
#   cargo build --profile bench-stable -p cove-cli -p cove-bench
#   ./target/bench-stable/cove-bench --iterations 15
[profile.bench-stable]
inherits = "release"
codegen-units = 1
